name: ResQNet E2E Automation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web-tests:
    name: Selenium Web E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Start Dev Server & Run Selenium Tests
        run: |
          npm run dev &
          npx wait-on http://127.0.0.1:5173 -t 90000
          npx cross-env HEADLESS=true npm run test:web
        env:
          CI: true
          PORT: 5173
          TEST_URL: http://127.0.0.1:5173
          VITE_SUPABASE_URL: https://ziutypjgzzayeqwkdnco.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_23qyxTDgqsbRpC7-JaA3DQ_4HtpSNy1

      - name: Upload Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ResQNet_E2E_Test_Report_Excel
          path: e2e-tests/reports/web/*.xlsx
          retention-days: 30
