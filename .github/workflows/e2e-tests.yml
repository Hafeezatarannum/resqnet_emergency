name: ResQNet Web, Mobile & Load Automation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-and-load-tests:
    name: Web (308), Appium Mobile (500) & Load (300 VUs) Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Start Dev Server & Run Selenium Web Tests (308 Test Cases)
        run: |
          npm run dev &
          npx wait-on http://127.0.0.1:5173 -t 90000
          npx cross-env HEADLESS=true npm run test:web
        env:
          CI: true
          PORT: 5173
          TEST_URL: http://127.0.0.1:5173
          VITE_SUPABASE_URL: https://ziutypjgzzayeqwkdnco.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_23qyxTDgqsbRpC7-JaA3DQ_4HtpSNy1

      - name: Run Appium Mobile E2E Tests (500 Test Cases)
        if: always()
        run: |
          npx cross-env HEADLESS=true npm run test:mobile
        env:
          CI: true
          PORT: 5173
          TEST_URL: http://127.0.0.1:5173
          VITE_SUPABASE_URL: https://ziutypjgzzayeqwkdnco.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_23qyxTDgqsbRpC7-JaA3DQ_4HtpSNy1

      - name: Run Baseline / Load Test (300 VUs / 60 Seconds)
        if: always()
        run: |
          npm run test:load
        env:
          CI: true
          TEST_URL: http://127.0.0.1:5173
          VUS: 300
          DURATION: 60

      - name: Upload Web E2E Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ResQNet_Web_E2E_Test_Report_Excel
          path: e2e-tests/reports/web/*.xlsx
          retention-days: 30

      - name: Upload Mobile Appium E2E Excel Report (500 Test Cases)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ResQNet_Mobile_Appium_E2E_Test_Report_Excel
          path: e2e-tests/reports/mobile/*.xlsx
          retention-days: 30

      - name: Upload Baseline Load Test Excel Report (300 VUs / 60s)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ResQNet_Load_Test_Report_Excel
          path: e2e-tests/reports/load/*.xlsx
          retention-days: 30
